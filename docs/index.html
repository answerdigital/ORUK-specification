<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Answer Digital Open Referral UK API documentation</title>
    <link rel="stylesheet" href="./swagger-ui.css">
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <noscript>JavaScript is required to view the Swagger API documentation.</noscript>
    <div id="swagger-ui"></div>
    <script src="./swagger-ui-bundle.js"></script>
    <script>
      window.addEventListener("load", () => {
        window.ui = SwaggerUIBundle({
          url: "./schema/openapi.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          validatorUrl: null,
          supportedSubmitMethods: [],
          layout: "BaseLayout"
        });
      });
    </script>
  </body>
</html>
